name: OCRBooks
options:
  bundleIdPrefix: com.ocrbooks
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  # OpenCV precompilado (xcframework) para el inpainting de manchas.
  OpenCV:
    url: https://github.com/yeatse/opencv-spm
    from: 5.0.0

targets:
  OCRBooks:
    type: application
    platform: macOS
    sources:
      - OCRBooks
    dependencies:
      - package: OpenCV
        product: OpenCV
    info:
      path: OCRBooks/Info.plist
      properties:
        CFBundleDisplayName: OCRBooks
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
    entitlements:
      path: OCRBooks/OCRBooks.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # Descarga del modelo de IA (Real-ESRGAN) desde Hugging Face.
        com.apple.security.network.client: true
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
